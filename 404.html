<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Kavian Development Mine</title>
  <link rel="icon" type="image/svg+xml" href="https://cdn.grapesjs.com/workspaces/cmgvbwak408ja13nsemkia83b/assets/7e057c43-5d96-4c3a-a8fc-8bd5f6589a93__kavianpremiumbadgelogo.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
      * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
      body { 
          background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
          color: white; min-height: 100vh; 
          display: flex; align-items: center; justify-content: center; 
          overflow: hidden; position: relative;
      }
      
      .background-animation {
          position: absolute; width: 100%; height: 100%; overflow: hidden; z-index: 0;
      }
      .circle { 
          position: absolute; border-radius: 50%; 
          background: radial-gradient(circle, rgba(245, 158, 11, 0.1), transparent); 
          animation: float 20s infinite ease-in-out;
      }
      .circle:nth-child(1) { width: 300px; height: 300px; top: 10%; left: 10%; animation-delay: 0s; }
      .circle:nth-child(2) { width: 400px; height: 400px; bottom: 10%; right: 10%; animation-delay: 5s; }
      .circle:nth-child(3) { width: 200px; height: 200px; top: 50%; left: 50%; animation-delay: 10s; }
      
      @keyframes float {
          0%, 100% { transform: translate(0, 0) scale(1); }
          50% { transform: translate(50px, 50px) scale(1.1); }
      }
      
      .error-container { 
          text-align: center; z-index: 1; position: relative; 
          max-width: 800px; padding: 40px;
      }
      
      .error-code { 
          font-size: 12rem; font-weight: 900; 
          background: linear-gradient(135deg, #f59e0b 0%, #ef4444 50%, #8b5cf6 100%); 
          -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
          background-clip: text; line-height: 1; margin-bottom: 20px;
          animation: glitch 3s infinite;
      }
      
      @keyframes glitch {
          0%, 100% { text-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }
          25% { text-shadow: -5px 0 10px rgba(239, 68, 68, 0.5); }
          50% { text-shadow: 5px 0 10px rgba(139, 92, 246, 0.5); }
          75% { text-shadow: 0 5px 10px rgba(245, 158, 11, 0.5); }
      }
      
      .error-title { 
          font-size: 3rem; font-weight: 700; margin-bottom: 20px; 
          color: white;
      }
      
      .error-message { 
          font-size: 1.3rem; color: rgba(255,255,255,0.7); 
          margin-bottom: 40px; line-height: 1.8;
      }
      
      .search-box { 
          max-width: 500px; margin: 0 auto 40px; 
          display: flex; gap: 10px;
      }
      
      .search-input { 
          flex: 1; padding: 18px 25px; 
          background: rgba(30, 41, 59, 0.8); 
          border: 2px solid rgba(148, 163, 184, 0.2); 
          border-radius: 50px; color: white; font-size: 1rem;
          transition: all 0.3s;
      }
      
      .search-input:focus { 
          outline: none; 
          border-color: #f59e0b; 
          box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
      }
      
      .search-btn { 
          padding: 18px 35px; 
          background: linear-gradient(135deg, #f59e0b, #ef4444); 
          border: none; border-radius: 50px; color: white; 
          font-weight: 700; cursor: pointer; transition: all 0.3s;
      }
      
      .search-btn:hover { 
          transform: translateY(-3px); 
          box-shadow: 0 10px 30px rgba(245, 158, 11, 0.4);
      }
      
      .quick-links { 
          display: flex; gap: 20px; justify-content: center; 
          flex-wrap: wrap; margin-bottom: 40px;
      }
      
      .quick-link { 
          display: inline-flex; align-items: center; gap: 10px; 
          padding: 12px 25px; background: rgba(30, 41, 59, 0.5); 
          border: 2px solid rgba(148, 163, 184, 0.2); 
          border-radius: 50px; color: white; text-decoration: none; 
          font-weight: 600; transition: all 0.3s;
      }
      
      .quick-link:hover { 
          background: rgba(245, 158, 11, 0.1); 
          border-color: #f59e0b; transform: translateY(-3px);
      }
      
      .back-home { 
          display: inline-flex; align-items: center; gap: 10px; 
          padding: 18px 40px; 
          background: linear-gradient(135deg, #f59e0b, #ef4444); 
          border-radius: 50px; color: white; text-decoration: none; 
          font-weight: 700; font-size: 1.1rem; transition: all 0.3s;
          box-shadow: 0 10px 30px rgba(245, 158, 11, 0.3);
      }
      
      .back-home:hover { 
          transform: translateY(-5px); 
          box-shadow: 0 15px 40px rgba(245, 158, 11, 0.5);
      }
      
      .support-text { 
          margin-top: 40px; font-size: 0.95rem; 
          color: rgba(255,255,255,0.5);
      }
      
      .support-text a { 
          color: #f59e0b; text-decoration: none; 
          font-weight: 600; transition: color 0.3s;
      }
      
      .support-text a:hover { color: #ef4444; }
      
      @media (max-width: 768px) {
          .error-code { font-size: 8rem; }
          .error-title { font-size: 2rem; }
          .error-message { font-size: 1.1rem; }
          .quick-links { flex-direction: column; align-items: center; }
      }
  </style>
</head>
<body>
  <div class="background-animation">
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
  </div>
  
  <div class="error-container">
      <div class="error-code">404</div>
      <h1 class="error-title">Oops! Page Not Found</h1>
      <p class="error-message">
          The page you're looking for seems to have wandered off into the mining depths. 
          Don't worry, we'll help you find your way back!
      </p>
      
      <div class="search-box">
          <input 
              type="text" 
              class="search-input" 
              placeholder="Search our site..."
              id="search-input"
          >
          <button class="search-btn" onclick="performSearch()">
              <i class="fas fa-search"></i>
          </button>
      </div>
      
      <div class="quick-links">
          <a href="index.html" class="quick-link">
              <i class="fas fa-home"></i> Home
          </a>
          <a href="services.html" class="quick-link">
              <i class="fas fa-cogs"></i> Services
          </a>
          <a href="portfolio.html" class="quick-link">
              <i class="fas fa-briefcase"></i> Portfolio
          </a>
          <a href="blog.html" class="quick-link">
              <i class="fas fa-blog"></i> Blog
          </a>
          <a href="contact.html" class="quick-link">
              <i class="fas fa-envelope"></i> Contact
          </a>
      </div>
      
      <a href="index.html" class="back-home">
          <i class="fas fa-arrow-left"></i>
          Back to Homepage
      </a>
      
      <p class="support-text">
          Still can't find what you're looking for? 
          <a href="contact.html">Contact our support team</a>
      </p>
  </div>
  
  <script>
      function performSearch() {
          const query = document.getElementById('search-input').value;
          if (query.trim()) {
              window.location.href = `search.html?q=${encodeURIComponent(query)}`;
          }
      }
      
      document.getElementById('search-input').addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
              performSearch();
          }
      });
  </script>
</body>
</html>
